version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp-simulator-db
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator123
      POSTGRES_DB: whatsapp_simulator
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulator-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: whatsapp-simulator-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://simulator:simulator123@postgres:5432/whatsapp_simulator
      JWT_SECRET: educational_demo_secret_change_in_production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: debug
    volumes:
      - ../backend/src:/app/src
      - ../backend/logs:/app/logs
      - /app/node_modules
    ports:
      - "5000:5000"
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - simulator-network

  # Frontend application
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: whatsapp-simulator-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
      NODE_ENV: development
    volumes:
      - ../frontend/src:/app/src
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - simulator-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: whatsapp-simulator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulator-network

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: whatsapp-simulator-adminer
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    networks:
      - simulator-network

  # Monitoring with Prometheus and Grafana (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: whatsapp-simulator-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - simulator-network

  grafana:
    image: grafana/grafana:latest
    container_name: whatsapp-simulator-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - simulator-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  simulator-network:
    driver: bridge
